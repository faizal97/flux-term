<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient - deep indigo with subtle depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <!-- F stroke gradient - lavender to slightly brighter -->
    <linearGradient id="fStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9E0F8"/>
      <stop offset="100%" stop-color="#BAC2DE"/>
    </linearGradient>

    <!-- Crossbar gradient - lavender fading to peach at tip -->
    <linearGradient id="crossbarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CDD6F4"/>
      <stop offset="60%" stop-color="#CDD6F4"/>
      <stop offset="85%" stop-color="#F2CDCD"/>
      <stop offset="100%" stop-color="#F5E0DC"/>
    </linearGradient>

    <!-- Bloom - outer soft glow -->
    <radialGradient id="bloomOuter" cx="0.35" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#F5E0DC" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#F5C2B8" stop-opacity="0.2"/>
      <stop offset="65%" stop-color="#F5A0A0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F5E0DC" stop-opacity="0"/>
    </radialGradient>

    <!-- Bloom - inner hot glow -->
    <radialGradient id="bloomInner" cx="0.3" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF5F3" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#F5E0DC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5E0DC" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow filter -->
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="25"/>
    </filter>

    <!-- Medium glow filter -->
    <filter id="glowMed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>

    <!-- Tight glow filter -->
    <filter id="glowTight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <!-- F bar subtle shadow -->
    <filter id="barShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#11111B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <!-- macOS icon rounded rect (rx=227 ≈ 22.17% for macOS squircle) -->
  <rect width="1024" height="1024" rx="227" ry="227" fill="url(#bg)"/>

  <!-- Very subtle vignette for depth -->
  <radialGradient id="vignette" cx="0.48" cy="0.46" r="0.72">
    <stop offset="0%" stop-color="#1E1E2E" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0D0D14" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="227" ry="227" fill="url(#vignette)"/>

  <!-- === BLOOM EFFECT (behind the F) === -->

  <!-- Outer bloom haze -->
  <ellipse cx="660" cy="500" rx="220" ry="160" fill="url(#bloomOuter)" filter="url(#glowSoft)" opacity="0.8"/>

  <!-- Mid bloom -->
  <ellipse cx="645" cy="500" rx="140" ry="100" fill="url(#bloomInner)" filter="url(#glowMed)" opacity="0.9"/>

  <!-- Hot spot at crossbar tip -->
  <ellipse cx="632" cy="500" rx="50" ry="38" fill="#F5E0DC" filter="url(#glowTight)" opacity="0.5"/>

  <!-- === THE F MONOGRAM === -->
  <g filter="url(#barShadow)">

    <!-- Vertical bar -->
    <rect x="310" y="272" width="82" height="480" rx="10" ry="10" fill="url(#fStroke)"/>

    <!-- Top horizontal bar -->
    <rect x="310" y="272" width="370" height="82" rx="10" ry="10" fill="url(#fStroke)"/>

    <!-- Middle crossbar (with gradient to peach at tip) -->
    <rect x="310" y="462" width="322" height="76" rx="10" ry="10" fill="url(#crossbarGrad)"/>

  </g>

  <!-- Crossbar tip bright accent -->
  <rect x="610" y="470" width="22" height="60" rx="10" ry="10" fill="#F5E0DC" filter="url(#glowTight)" opacity="0.6"/>

  <!-- === SUBTLE ACCENTS === -->

  <!-- Faint blue accent at bottom of vertical bar -->
  <rect x="316" y="710" width="70" height="36" rx="6" ry="6" fill="#89B4FA" opacity="0.08" filter="url(#glowMed)"/>

</svg>