name: PR Standard

on:
  pull_request:
    types: [opened, edited, reopened]

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)[[:space:]]*(\([[:alnum:]_\-\.\/]+\))?[[:space:]]*:[[:space:]]*.+$'

          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title does not match Conventional Commits format."
            echo ""
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Got:      $TITLE"
            echo ""
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo ""
            echo "Examples:"
            echo "  feat: add bloom shader effect"
            echo "  fix(renderer): resolve Metal crash on Intel"
            echo "  docs: update contributing guide"
            echo "  refactor (terminal): simplify key encoding"
            exit 1
          fi

          echo "PR title is valid: $TITLE"
