name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-13]
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-test-${{ matrix.runner }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-test-${{ matrix.runner }}-

      - name: Run tests
        run: swift test
